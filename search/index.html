  <script>
  (function(){
    var index=[{"id":"2d-animation","title":"2D 动画：关键帧、Breakdown、循环","summary":"2D 不是一张张画得漂亮，而是用关键帧和 breakdown 控制时间。先让一个动作读得懂。","site":"animation","url":"/article/2d-animation/"},{"id":"stop-motion","title":"定格动画：一张一张拍","summary":"定格最磨人的地方是稳定：相机别动、光别动、动作每次只改一点。一天拍两秒很正常，别以为自己慢。","site":"animation","url":"/article/stop-motion/"},{"id":"3d-pipeline","title":"3D 动画管线：从 blockout 到渲染","summary":"3D 不是建模完就动画。先 blockout 定时间，再 layout、animation、lighting、render，每一步都能回退。","site":"animation","url":"/article/3d-pipeline/"},{"id":"animation-timing","title":"动画的时间感：两张原画之间，决定重量","summary":"一个球从桌上掉下来，画几张中间帧、每张隔多远，观众就能感觉到它是乒乓球还是铅球。","site":"animation","url":"/article/animation-timing/"},{"id":"animation-walk","title":"走路循环：脚落地那一下","summary":"走路看起来难，是因为脚会滑、重心不对、手脚同拍。先把四个姿势站住，再谈风格。","site":"animation","url":"/article/animation-walk/"},{"id":"animation-lip-sync","title":"口型：先对辅音，再画表情","summary":"口型不是把每个字都画出来。先对闭唇的辅音，再给元音开口，表情晚半拍，观众就觉得是他在说。","site":"animation","url":"/article/animation-lip-sync/"},{"id":"animation-principles","title":"十二原则：别一次全用","summary":"十二原则不是十二个滤镜；一个动作先用一个原则解释，观众才看得懂。","site":"animation","url":"/article/animation-principles/"},{"id":"rigging","title":"绑定：让关节能转","summary":"绑定先让关节转得对，再让皮肤变形好看；转不动，权重再细也没用。","site":"animation","url":"/article/rigging/"},{"id":"mg-typography","title":"字效：先读清再动","summary":"字效先保证静止时读得清，再决定怎么动；边动边读，阅读速度会掉一半。","site":"animation","url":"/article/mg-typography/"},{"id":"weight","title":"重量：落地的加速度","summary":"重量不在姿势，在落地那几帧的加减速；没有加速度，一切像气球。","site":"animation","url":"/article/weight/"},{"id":"anticipation","title":"预备动作：让观众先知道","summary":"预备动作让观众提前知道要发生什么；没有预备，动作像突然被剪进来。","site":"animation","url":"/article/anticipation/"},{"id":"run-cycle","title":"跑步循环：脚与重心","summary":"跑步循环先定重心和脚掌着地顺序，再修手臂；脚不对，全身都飘。","site":"animation","url":"/article/run-cycle/"},{"id":"loop-cycle","title":"循环动作：首尾怎么接","summary":"循环动作首尾帧必须对得上，否则每转一圈就抖一下。","site":"animation","url":"/article/loop-cycle/"},{"id":"2d-compositing","title":"二维合成：背景、前景、光","summary":"二维合成把背景、人物、光效分层；全压在一张图里，改一个动作就要重画全部。","site":"animation","url":"/article/2d-compositing/"},{"id":"2d-camera","title":"二维运镜：pan 与 multiplane","summary":"二维运镜不是把整张图平移；用多层不同速度，才有空间。","site":"animation","url":"/article/2d-camera/"},{"id":"blockout","title":"Blockout：先定比例和机位","summary":"Blockout 先定比例、机位和时长，不建模细节；这一步错了，后面全返工。","site":"animation","url":"/article/blockout/"},{"id":"modeling","title":"建模：面数与轮廓","summary":"建模先看轮廓，再看面数；轮廓不对，细分再多也不像。","site":"animation","url":"/article/modeling/"},{"id":"materials","title":"材质：粗糙度与高光","summary":"材质先调粗糙度和高光，再贴纹理；这两项决定它是塑料、木头还是金属。","site":"animation","url":"/article/materials/"},{"id":"lighting-3d","title":"三维灯光：三点与 HDRI","summary":"三维灯光先用主光、补光、轮廓光定结构，再用 HDRI 补环境；顺序反了，空间会平。","site":"animation","url":"/article/lighting-3d/"},{"id":"render","title":"渲染：采样与噪点","summary":"渲染先看采样和噪点，再看分辨率；噪点没压住，4K 也只是更大的脏。","site":"animation","url":"/article/render/"},{"id":"layout","title":"Layout：镜头与资产交接","summary":"Layout 把机位、比例、资产版本锁死，再交给动画；交接不清，动画师只能猜。","site":"animation","url":"/article/layout/"},{"id":"armature","title":"人偶骨架：能站住才能演","summary":"定格人偶先能站住、能走、能重复，再谈表演；骨架软，拍十帧就塌。","site":"animation","url":"/article/armature/"},{"id":"stop-motion-set","title":"定格布景：尺度与透视线","summary":"定格布景先定人偶比例，再按镜头透视做大小；比例错了，怎么打光都假。","site":"animation","url":"/article/stop-motion-set/"},{"id":"stop-motion-motion-blur","title":"定格运动模糊：拍两遍","summary":"定格运动模糊靠两次曝光或后期合成，不是把帧率调低。","site":"animation","url":"/article/stop-motion-motion-blur/"},{"id":"mg-transition","title":"图形转场：形状接形状","summary":"图形转场让一个形状变成另一个形状，别用白闪或随便推拉。","site":"animation","url":"/article/mg-transition/"},{"id":"mg-infographic","title":"信息动画：一条线只讲一件事","summary":"信息动画一条线只讲一件事；线越多，观众越记不住。","site":"animation","url":"/article/mg-infographic/"},{"id":"mg-rhythm","title":"动效节奏：音乐点与帧","summary":"动效节奏先把音乐点对到帧，再决定缓入缓出；点没对上，再顺也乱。","site":"animation","url":"/article/mg-rhythm/"},{"id":"animatic-pipeline","title":"Animatic：配音、定时、改镜头","summary":"Animatic 先放配音、定每条时长、再改分镜；没有声音，时间感是假的。","site":"animation","url":"/article/animatic-pipeline/"},{"id":"asset-handoff","title":"资产交接：命名、版本、缓存","summary":"资产交接写清命名、版本、缓存和依赖；少一样，下一个人就要重做。","site":"animation","url":"/article/asset-handoff/"},{"id":"animation-case","title":"短片复盘：从分镜到成片","summary":"动画案例复盘按“分镜—animatic—layout—动画—灯光—合成”逐段对照，不只夸成片。","site":"animation","url":"/article/animation-case/"},{"id":"deep-2d-layer-depth","title":"二维分层景深：从分层到成片","summary":"二维的空间不是画出来的，是分层、速度差和遮挡一起算出来的。","site":"animation","url":"/article/deep-2d-layer-depth/"},{"id":"deep-loop-cycle-design","title":"循环动作：走、跑、呼吸的一次设计","summary":"循环不是把首尾接上，而是让重心、接触和节奏在同一拍里闭合。","site":"animation","url":"/article/deep-loop-cycle-design/"},{"id":"deep-blockout-to-animatic","title":"从 Blockout 到 Animatic：一条可审的动画链","summary":"先看空间和时长，再看表演；blockout 与 animatic 是两道不同的审片门。","site":"animation","url":"/article/deep-blockout-to-animatic/"},{"id":"deep-rig-handoff","title":"绑定交接：把“能拉”做成“能交”","summary":"绑定交付不是骨骼能动能拉，而是极限姿势、命名和权重都能被下一位接住。","site":"animation","url":"/article/deep-rig-handoff/"},{"id":"deep-3d-light-material","title":"3D 灯光与材质：一次只改一个变量","summary":"灯光和材质互相伪装；先固定一个，再判断另一个，才不会越调越糊。","site":"animation","url":"/article/deep-3d-light-material/"},{"id":"deep-compositing-2d3d","title":"2D/3D 合成：深度、边缘与运动","summary":"合成不是把两层叠在一起，而是让深度、边缘和运动方向同时说同一种空间。","site":"animation","url":"/article/deep-compositing-2d3d/"},{"id":"deep-render-budget","title":"渲染预算：先算，再渲","summary":"渲染时间不是最后才出现的问题；分辨率、采样、层数和返工次数要先算成预算。","site":"animation","url":"/article/deep-render-budget/"},{"id":"deep-animation-qc","title":"动画 QC：从镜头到资产","summary":"动画 QC 不是只看画面漂不漂亮，而是镜头、绑定、资产和交付命名都能被复现。","site":"animation","url":"/article/deep-animation-qc/"},{"id":"deep-motion-graphics","title":"动效系统：从一条线到一套语法","summary":"动效不是让每条线都动，而是建立层级、路径、时间和停顿的一套语法；一条线只讲一件事。","site":"animation","url":"/article/deep-motion-graphics/"},{"id":"deep-animation-acting","title":"动画表演：给角色一个意图","summary":"角色能动不等于在表演；先给意图，再做预备、动作和反应，观众才会相信它在想。","site":"animation","url":"/article/deep-animation-acting/"}];
    var siteName={"main":"主站","story":"故事","shoot":"拍摄","post":"后期","ai":"AI","animation":"动画","formats":"片型","tools":"工具","context":"影像史"};
    var input=document.getElementById('staticSearchInput');
    var out=document.getElementById('staticSearchResults');
    var defaultBox=document.getElementById('searchDefault');
    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
    function syncQuery(){
      var params=new URLSearchParams(location.search);
      var value=input.value.trim();
      if(value) params.set('q',value); else params.delete('q');
      var query=params.toString();
      try{history.replaceState(null,'',location.pathname+(query?'?'+query:''))}catch(e){}
    }
    function render(){
      var q=input.value.trim().toLowerCase();
      if(defaultBox) defaultBox.style.display=q?'none':'';
      if(!q){out.innerHTML='<p class="search-hint">输入关键词开始搜索。</p>';return}
      var all=index.filter(function(x){return (x.title+' '+x.summary+' '+x.site+' '+x.id).toLowerCase().indexOf(q)>=0}); var hits=all.slice(0,24);
      if(!hits.length){out.innerHTML='<div class="empty"><p class="search-hint">没有匹配的文章。</p></div>';return}
      out.innerHTML='<p class="search-count">'+all.length+' 条结果'+(all.length>24?' （显示前 24 条）':'')+'</p><div class="search-results">'+hits.map(function(x){return '<a class="search-result" href="'+x.url+'"><span class="result-type">'+esc(siteName[x.site]||x.site)+'</span><span><span class="result-title">'+esc(x.title)+'</span><span class="result-summary">'+esc(x.summary)+'</span></span></a>'}).join('')+'</div>';
    }
    function update(){render();syncQuery()}
    input.addEventListener('input',update);
    var initial=new URLSearchParams(location.search).get('q');
    if(initial){input.value=initial;render()}
  })();
  </script>
